name: Build browser packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Chrome and Firefox packages
        shell: pwsh
        run: ./scripts/package-distributions.ps1
      - name: Upload browser packages
        uses: actions/upload-artifact@v4
        with:
          name: nexus-media-preview-browser-packages
          path: dist/nexus-media-preview-*.zip
          if-no-files-found: error
